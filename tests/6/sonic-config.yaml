bgp_ports:
  - Ethernet50
  - Ethernet51

docker_routing_config_mode: split
frr_mgmt_framework_config: true
hostname: mgmtleaf
mgmt_vrf: false

ntp:
  servers:
    - 162.159.200.1
    - 162.159.200.123

ports:
  default_autoneg: on

vlans:
  - id: 1
    ip: 10.1.1.1/24
    untagged_ports:
      - Ethernet0
  - id: 2
    ip: 192.168.0.1/24
    untagged_ports:
    - Ethernet1
    - Ethernet2
    tagged_ports:
    - Ethernet3
    vrrp:
      group: 1
      ip: 10.1.2.1/24

acl:
  ACL_TABLE:
    PXE_IN:
      policy_desc: PXE vlan must not reach the cluster
      type: L3
      stage: ingress
      ports:
        - Vlan1
  ACL_RULE:
    PXE_IN|PERMIT_1:
      PRIORITY: 8999
      PACKET_ACTION: FORWARD
      DST_IP: 10.1.1.1/32
    PXE_IN|DENY_1:
      PRIORITY: "7999"
      PACKET_ACTION: DROP
      DST_IP: 10.0.0.0/16
    PXE_IN|PERMIT_REST:
      PRIORITY: "1000"
      PACKET_ACTION: FORWARD
      IP_TYPE: IPV4ANY
